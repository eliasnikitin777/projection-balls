<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проекции — шарики в кубе</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #f7f6f3; color: #33313a; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hint { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 16px; border-radius: 24px; background: #ffffffd9; box-shadow: 0 4px 24px #38313d14; white-space: nowrap; pointer-events: none; user-select: none; }
    .settings-button { position: fixed; top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #858585; color: white; cursor: pointer; box-shadow: 0 3px 12px #2222; }
    .settings-button:hover { background: #6f6f6f; }
    .settings-button svg { width: 22px; height: 22px; }
    .settings-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: #24252c55; backdrop-filter: blur(4px); }
    .settings-backdrop.open { display: grid; }
    .settings-panel { width: min(100%, 390px); padding: 25px; border-radius: 20px; background: #fff; box-shadow: 0 18px 70px #14141d35; }
    .settings-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .settings-heading h1 { margin: 0; font-size: 21px; }
    .close-settings { border: 0; background: transparent; color: #777; font-size: 25px; cursor: pointer; }
    .setting { display: block; margin: 17px 0 21px; }
    .setting-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 14px; }
    .setting output { color: #69727c; font-variant-numeric: tabular-nums; }
    .setting input { width: 100%; accent-color: #4b9ee5; }
    .setting-help { margin: -10px 0 18px; color: #777; font-size: 12px; }
    .reset-button { width: 100%; padding: 12px 16px; border: 0; border-radius: 12px; background: #4b9ee5; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    .reset-button:hover { background: #3789d0; }
    @media (max-width: 520px) { .hint { bottom: max(15px, env(safe-area-inset-bottom)); font-size: 12px; } .settings-button { top: 14px; right: 14px; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Поворачиваемый прозрачный куб с синими шариками"></canvas>
  <div class="hint">Потяните, чтобы повернуть куб</div>
  <button class="settings-button" id="open-settings" aria-label="Настройки" title="Настройки">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42l-.36 2.54c-.59.23-1.14.55-1.63.94l-2.39-.96a.49.49 0 0 0-.61.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.3.61.22l2.39-.96c.49.39 1.04.71 1.63.94l.36 2.54c.04.24.24.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.54c.59-.23 1.14-.55 1.63-.94l2.39.96c.24.08.49-.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
  </button>
  <div class="settings-backdrop" id="settings-backdrop">
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-heading"><h1 id="settings-title">Настройки</h1><button class="close-settings" id="close-settings" aria-label="Закрыть">×</button></div>
      <label class="setting"><span class="setting-label"><span>Размер шара</span><output id="size-value"></output></span><input id="size-slider" type="range" min="7" max="17" step="0.5"></label>
      <label class="setting"><span class="setting-label"><span>Расстояние соединения</span><output id="connect-value"></output></span><input id="connect-slider" type="range" min="0" max="15" step="0.01"></label>
      <label class="setting"><span class="setting-label"><span>Расстояние разъединения</span><output id="release-value"></output></span><input id="release-slider" type="range" min="0" max="32" step="0.01"></label>
      <p class="setting-help">Расстояния указаны относительно размера куба. Разъединение не может быть ближе соединения.</p>
      <button class="reset-button" id="reset-game">Reset</button>
    </section>
  </div>
  <script src="./main.js?v=20261001-4"></script>
</body>
</html>
